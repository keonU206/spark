# 프론트의 기본 baseURL이 http://localhost:4000 이라 포트를 맞춘다 (spark/src/services/http.ts)
server:
  port: 4000

spring:
  datasource:
    # 로컬 기본값(XAMPP MariaDB). 배포 환경에서는 환경변수로 덮어쓴다
    url: ${DB_URL:jdbc:mariadb://localhost:3306/spark}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      # 해커톤 개발 단계: 엔티티 기준으로 스키마 자동 갱신. 배포 시점에 validate로 바꾼다
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  jwt:
    # 개발 기본값. 배포 시 JWT_SECRET 환경변수로 반드시 교체 (32바이트 이상)
    secret: ${JWT_SECRET:spark-dev-secret-key-change-me-in-production-1234}
    access-token-minutes: 60
    refresh-token-days: 30
  google:
    # 구글 로그인 검증용. 비어 있으면 소셜 로그인은 501을 돌려준다
    client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    org.hibernate.SQL: debug
